<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tute Online (prototipo)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b5c3b;
            font-family: Arial, sans-serif;
        }

        #btnRepartir {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 2000;
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
        }

        #turno {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 2000;
            color: white;
            font-size: 16px;
        }

        #triunfo {
            position: fixed;
            top: 50px;
            right: 10px;
            z-index: 1500;
            text-align: center;
            color: white;
        }

        #baza {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }

        #mesa {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        /* 🔴 CLAVE: oculto por defecto */
        #fin-mano {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3000;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px 30px;
            border-radius: 10px;
            display: none;
            color: white;
            text-align: center;
            font-size: 20px;
        }

        #rival-1, #rival-2, #rival-3 {
            z-index: 900;
        }
    </style>
</head>

<body>

    <button id="btnRepartir">Repartir</button>
    <div id="turno"></div>
    <div id="triunfo"></div>

    <div id="rival-1"></div>
    <div id="rival-2"></div>
    <div id="rival-3"></div>

    <div id="baza"></div>
    <div id="mesa"></div>

    <div id="fin-mano"></div>

    <script src="script.js"></script>
</body>
</html>
